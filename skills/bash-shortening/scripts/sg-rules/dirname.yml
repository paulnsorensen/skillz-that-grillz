id: bash-shorten-dirname
language: bash
severity: hint
message: 'dirname of a quoted variable collapses to ${X%/*} — equivalent for absolute paths. NOTE: dirname returns "." for paths with no slash; the parameter expansion returns the original.'
rule:
  all:
    - pattern: '$(dirname "$ARG")'
    - has:
        kind: variable_name
        pattern: $V
        stopBy: end
fix: '${$V%/*}'
