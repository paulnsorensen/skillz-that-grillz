# ast-grep config for the bash-shortening skill.
#
# This is the alternate AST-aware engine for bash-shorten.py. The Python
# engine in scripts/bash-shorten.py covers all 16 rules with regex; this
# pack covers the subset where tree-sitter-bash exposes enough structure
# to do safe AST-level rewrites.
#
# Run directly with:
#   sg scan --config skills/bash-shortening/scripts/sgconfig.yml path/to/script.sh
#
# Or via bash-shorten.py:
#   python3 scripts/bash-shorten.py --engine sg path/to/script.sh
#
# The Python script orchestrates: it dispatches the rules in this directory
# to sg, then runs the remaining (Python-only) rules over the sg output.
#
# Why isn't every rule here?
#
# - mkdir-guard, empty-default — need ARG1 == ARG2 cross-metavariable
#   equality to skip mismatched-var cases. ast-grep can't express that
#   constraint cleanly; the Python regex uses a backreference instead.
# - combined-tests — tree-sitter-bash flattens [ ... ] (test_command) into
#   a list of word tokens, so structural matching on the operator side is
#   brittle.
# - test-numeric — same flattening, plus the operator map (-gt → >, etc.)
#   needs lambda-style replacement that YAML rules can't express.
# - sed-replace-* — the literal-pattern guard needs character-class
#   restrictions in the matcher, which the Python rule expresses with a
#   regex charset.
#
# When tree-sitter-bash matures further (or when ast-grep adds cross-meta
# equality), more rules can move here.

ruleDirs:
  - sg-rules
