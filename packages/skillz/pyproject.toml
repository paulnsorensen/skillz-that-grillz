[project]
name = "skillz"
version = "0.0.0"
description = "Sources for the /skillz skill's bundled skillz-experiment and inspect-skill CLIs."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Paul Sorensen", email = "paulnsorensen@gmail.com" }]
# skills/skillz/wedge.toml bundles these packages as .pyz assets. Nothing publishes this distribution.
classifiers = ["Private :: Do Not Upload"]
# skillz_experiments imports wedge. The skillz-that-grillz distribution in packages/wedge holds wedge.
dependencies = ["fromargs>=0.2.0,<0.3", "skillz-that-grillz"]

[project.optional-dependencies]
experiments = ["gepa==0.1.4"]

[project.scripts]
skillz-experiment = "skillz_experiments._cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "basedpyright==1.40.1", "typing-extensions==4.16.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillz_experiments", "src/skillz_inspect"]

[tool.uv.sources]
fromargs = { workspace = true }
skillz-that-grillz = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests/skillz_experiments", "tests/skillz_inspect"]
markers = ["ac(id): ties a test to an acceptance-criterion ID"]
addopts = "--strict-markers"
