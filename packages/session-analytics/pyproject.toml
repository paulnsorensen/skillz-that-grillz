[project]
name = "session-analytics"
version = "0.1.0"
description = "Ingest coding-agent session logs into DuckDB and query them read-only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Sorensen", email = "paulnsorensen@gmail.com" }]
keywords = ["duckdb", "agent", "session-logs", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Environment :: Console",
  "Intended Audience :: Developers",
]
dependencies = ["fromargs>=0.2.0,<0.3"]

[project.scripts]
session-analytics = "session_analytics:main"

[project.urls]
Homepage = "https://github.com/paulnsorensen/skillz-that-grillz/tree/main/packages/session-analytics"
Source = "https://github.com/paulnsorensen/skillz-that-grillz/tree/main/packages/session-analytics"
Issues = "https://github.com/paulnsorensen/skillz-that-grillz/issues"
Changelog = "https://github.com/paulnsorensen/skillz-that-grillz/blob/main/packages/session-analytics/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "basedpyright==1.40.1"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_analytics"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".venv",
  "**/__pycache__",
  "**/.pytest_cache",
]

[tool.uv.sources]
fromargs = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.basedpyright]
pythonVersion = "3.11"
# Workspace members share the root .venv.
venvPath = "../.."
venv = ".venv"
include = ["src", "tests"]
