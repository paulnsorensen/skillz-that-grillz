name: wedge
description: >-
  Check or publish wedge-packaged skill CLIs: content-addressed .pyz assets on
  a rolling `wedge` GitHub release, verified by a committed sha256 lock.
author: paulnsorensen

# A composite action cannot set `permissions:`. `command: check` needs only
# read access. `command: publish` uploads assets, records their sha256 in each
# pending lock, and opens an auto-merge pull request with the updated locks.
# Its token needs `contents: write` and `pull-requests: write`. Use a GitHub
# App token: GitHub does not run workflows for a pull request that
# GITHUB_TOKEN opens, so required checks never report on the lock PR.
# The action runs wedge from its own checkout (lib/ beside this directory),
# so pinning this action to a commit SHA also pins the wedge version.

inputs:
  command:
    description: "`check` verifies every lock and launcher; `publish` builds and uploads missing assets."
    required: false
    default: publish
  roots:
    description: Space-separated skill discovery roots, relative to the workspace (each is globbed for */wedge.toml).
    required: false
    default: skills
  repo:
    description: GitHub repository (owner/name) that hosts the `wedge` release. `publish` refuses a lock that names another repository.
    required: false
    default: ${{ github.repository }}
  target:
    description: Commit-ish the `wedge` release points at if publish must create it.
    required: false
    default: ${{ github.sha }}
  token:
    description: "Token the gh CLI uses to publish and to push and open the lock PR. Needs `contents: write` and `pull-requests: write` on `repo`; prefer a GitHub App token."
    required: false
    default: ${{ github.token }}
  lock-branch:
    description: Branch that `publish` force-pushes with the recorded lock digests.
    required: false
    default: wedge/lock-update
  lock-base:
    description: Base branch for the lock pull request.
    required: false
    default: ${{ github.event.repository.default_branch }}

outputs:
  result:
    description: The JSON document wedge printed (check summary, or per-skill publish status).
    value: ${{ steps.wedge.outputs.result }}
  lock-pr:
    description: URL of the lock pull request `publish` opened or updated; empty when no lock changed.
    value: ${{ steps.lock-pr.outputs.url }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        WEDGE_COMMAND: ${{ inputs.command }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$WEDGE_COMMAND" in
          check) ;;
          publish)
            if [[ "$RUNNER_OS_NAME" != Linux || "$RUNNER_ARCH_NAME" != X64 ]]; then
              echo "::error::wedge publish installs a pinned linux_amd64 gh CLI; run it on a Linux X64 runner, not ${RUNNER_OS_NAME}/${RUNNER_ARCH_NAME}."
              exit 1
            fi
            ;;
          *)
            echo "::error::command must be 'check' or 'publish', got '${WEDGE_COMMAND}'."
            exit 1
            ;;
        esac

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.32"
        enable-cache: false

    - name: Install pinned gh CLI
      if: inputs.command == 'publish'
      shell: bash
      env:
        GH_VERSION: "2.92.0"
        # sha256 of gh_2.92.0_linux_amd64.tar.gz from the release's checksums file.
        GH_SHA256: b57848131bdf0c229cd35e1f2a51aa718199858b2e728410b37e89a428943ec4
      run: |
        set -euo pipefail
        tarball="$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64.tar.gz"
        bin_dir="$RUNNER_TEMP/bin"
        curl -fsSL -o "$tarball" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
        echo "${GH_SHA256}  ${tarball}" | sha256sum -c -
        tar -xzf "$tarball" -C "$RUNNER_TEMP"
        mkdir -p "$bin_dir"
        install -m 755 "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$bin_dir/gh"
        echo "$bin_dir" >>"$GITHUB_PATH"
        export PATH="$bin_dir:$PATH"
        "$bin_dir/gh" --version

    - name: Run wedge
      id: wedge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WEDGE_COMMAND: ${{ inputs.command }}
        WEDGE_ROOTS: ${{ inputs.roots }}
        WEDGE_REPO: ${{ inputs.repo }}
        WEDGE_TARGET: ${{ inputs.target }}
      run: |-
        set -euo pipefail
        # -d '' reads every line, so a multi-line YAML `roots: |` value works.
        read -r -d '' -a roots <<<"$WEDGE_ROOTS" || true
        if ((${#roots[@]} == 0)); then
          echo "::error::roots is empty."
          exit 1
        fi
        args=("$WEDGE_COMMAND")
        for root in "${roots[@]}"; do
          if [[ ! -d "$root" ]]; then
            echo "::error::root '${root}' is not a directory in $(pwd)."
            exit 1
          fi
          args+=(--root "$root")
        done
        if [[ "$WEDGE_COMMAND" == publish ]]; then
          args+=(--repo "$WEDGE_REPO" --target "$WEDGE_TARGET")
        fi
        work_dir=$(mktemp -d)
        trap 'rm -rf "$work_dir"' EXIT
        stdout_file="$work_dir/stdout"
        stderr_file="$work_dir/stderr"
        set +e
        uv run --locked --project "$GITHUB_ACTION_PATH/../../lib" wedge "${args[@]}" >"$stdout_file" 2>"$stderr_file"
        status=$?
        set -e
        if [[ -s "$stdout_file" ]]; then
          result=$(<"$stdout_file")
        else
          result=$(<"$stderr_file")
        fi
        if [[ -s "$stderr_file" ]]; then
          cat "$stderr_file" >&2
        fi
        printf '%s\n' "$result"
        delimiter="wedge_$(openssl rand -hex 16)"
        printf 'result<<%s\n%s\n%s\n' "$delimiter" "$result" "$delimiter" >>"$GITHUB_OUTPUT"
        if ((status != 0)); then
          exit "$status"
        fi

    # Runs after a partial publish failure too: a lock that recorded an
    # uploaded asset must still reach the base branch.
    - name: Open lock pull request
      id: lock-pr
      if: ${{ !cancelled() && inputs.command == 'publish' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WEDGE_REPO: ${{ inputs.repo }}
        WEDGE_LOCK_BRANCH: ${{ inputs.lock-branch }}
        WEDGE_LOCK_BASE: ${{ inputs.lock-base }}
      run: |-
        set -euo pipefail
        mapfile -t locks < <(git diff --name-only -- ':(glob)**/*.wedge.json')
        if ((${#locks[@]} == 0)); then
          echo "No lock recorded a new sha256."
          echo "url=" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        title="chore(wedge): record published .pyz digests"
        git add -- "${locks[@]}"
        git -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit --quiet -m "$title"
        # Push with inputs.token, not the checkout's persisted GITHUB_TOKEN
        # header: pushes by GITHUB_TOKEN do not trigger the PR's checks.
        git -c "http.${GITHUB_SERVER_URL}/.extraheader=" \
          -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
          push --force "${GITHUB_SERVER_URL}/${WEDGE_REPO}.git" "HEAD:refs/heads/${WEDGE_LOCK_BRANCH}"
        url=$(gh pr list --repo "$WEDGE_REPO" --head "$WEDGE_LOCK_BRANCH" --state open --json url --jq '.[0].url // empty')
        if [[ -z "$url" ]]; then
          url=$(gh pr create --repo "$WEDGE_REPO" --base "$WEDGE_LOCK_BASE" --head "$WEDGE_LOCK_BRANCH" \
            --title "$title" \
            --body "The wedge publish job uploaded these assets and recorded their sha256 in the locks: ${locks[*]}")
        fi
        if ! gh pr merge "$url" --repo "$WEDGE_REPO" --auto --squash; then
          echo "::warning::Cannot enable auto-merge on ${url}; merge it by hand."
        fi
        echo "url=${url}" >>"$GITHUB_OUTPUT"
