[project]
name = "skillz-experiment-bundle"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["fromargs>=0.2.0,<0.3"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "coverage==7.17.0",
    "diff-cover==11.0.0",
    "hypothesis>=6.170.13",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "pyyaml==6.0.3",
    "types-PyYAML==6.0.12.20260906",
    "typing-extensions==4.16.0",
    "vulture==2.16",
]
experiments = ["gepa==0.1.4"]
# Keep this pin inside packages/skillz/pyproject.toml's tenacity range; the skillz-experiment bundle carries it.
retry = ["tenacity==9.2.1"]

[tool.uv]
package = false

# One workspace and one uv.lock: the published packages live under packages/.
# The consumer example is a standalone project with its own lock.
[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/wedge/examples/consumer"]

[tool.uv.sources]
fromargs = { workspace = true }

[tool.basedpyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["packages", "skills"]
exclude = ["**/.venv", "**/__pycache__", "**/.pytest_cache", "**/.mypy_cache",
  # Byte-for-byte legacy gate source (gh-367): its bytes fix a content hash, so it stays untyped.
  "packages/skillz/tests/skillz_experiments/fixtures/evals/gates"]
extraPaths = ["packages/wedge/src", "packages/skillz/src", "packages/agent-session-analytics/src", "packages/fromargs/src", "packages/fromargs/examples"]
typeCheckingMode = "recommended"
failOnWarnings = true

[[tool.basedpyright.executionEnvironments]]
root = "packages/fromargs"
extraPaths = ["packages/fromargs/src", "packages/fromargs/examples"]

[[tool.basedpyright.executionEnvironments]]
root = "packages/skillz/tests/skillz_experiments/fixtures/mode/evals/gates"
extraPaths = ["packages/skillz/tests/skillz_experiments/fixtures/mode/evals/gates/mode"]
# Each mode gate runs as a script from its own directory, so it imports its sibling helpers by bare name.
reportImplicitRelativeImport = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/skillz/tests/skillz_experiments"
extraPaths = ["packages/wedge/src", "packages/skillz/src", "packages/agent-session-analytics/src", "packages/fromargs/src", "packages/fromargs/examples"]
# The test files share helper modules (`fake_provider`) from their own directory; it has no package marker.
reportImplicitRelativeImport = false

[[tool.basedpyright.executionEnvironments]]
root = "packages/skillz/tests/skillz_live"
extraPaths = ["packages/wedge/src", "packages/skillz/src", "packages/fromargs/src"]
# The live tests share `fromargs_benefit` and `semver_oracle` from their own directory; it has no package marker.
reportImplicitRelativeImport = false

[[tool.basedpyright.executionEnvironments]]
root = "skills/skillz/evals/gates"
# Each gate runs as a script from its own directory, so it imports its sibling helpers by bare name.
reportImplicitRelativeImport = false

[tool.vulture]
paths = [".github/scripts", "packages", "skills"]
exclude = ["*/.venv/*", "*/__pycache__/*", "*/.pytest_cache/*"]
min_confidence = 60
ignore_decorators = [
  "@app.command", "@app.default", "@crate.command", "@group.command", "@nested.command",
  "@nested.default", "@wheels.command", "@target.command",
  "@pytest.fixture", "@override",
]
ignore_names = ["pytestmark", "pytest_collection_modifyitems"]

# Coverage gate (.github/scripts/check_coverage.py): `just build` combines the pytest lane data, then checks the
# project floor, whole-symbol dead code, and the coverage of the lines that a change adds.
[tool.coverage.run]
# Measure the xdist workers and the CLI tests that start Python subprocesses.
patch = ["subprocess"]
# Most measured processes run no package code; a warning on their stderr breaks the tests that parse it.
disable_warnings = ["no-data-collected", "module-not-imported", "module-not-measured"]

[tool.coverage.report]
# The measured total at adoption, rounded down. Raise it when the gate says so; never lower it to pass.
fail_under = 97
exclude_also = ["if TYPE_CHECKING:", "@overload", "@abstractmethod", "raise NotImplementedError"]

[tool.skillz.coverage]
# The floor for the source lines that a change adds or edits, as codecov/patch measures them in milknado.
diff_fail_under = 95

# Whole-symbol dead code (.github/scripts/check_dead_code_coverage.py) exempts these `module:qualname` entries.
# Each entry says why no offline test runs it. The entries below are the adoption baseline; remove one when a test reaches it.
[tool.skillz.dead-code]
allow = [
  # Package data: `scaffold` copies the file into a skill, and the journey grader runs it there with `python3 -I`.
  "skillz_experiments._journey_gate:agent_turn",
  "skillz_experiments._journey_gate:main",
  # Called only in the failure message of test_schemas.py.
  "skillz_experiments._schemas:regenerate_command",
  # The `os.walk` error callback; no test makes a directory unreadable.
  "skillz_experiments.harness._claude._options:_holds_socket.onerror",
  # Harness adapter interface members that only a live run calls on these adapters.
  "skillz_experiments.harness._codex:Codex.resume",
  "skillz_experiments.harness._command:Command.credential_kind",
  "skillz_experiments.harness._command:Command.host_checks",
  "skillz_experiments.harness._command:Command.resume",
  # The entry of the built inspect-skill archive (skills/skillz/wedge.toml); the tests run the archive.
  "skillz_inspect._cli:main",
]

# File-size ratchet (.github/scripts/check_file_lengths.py): a ceiling only goes down; run `tighten` after a file shrinks.
[tool.skillz.file-size]
max_lines = 300

[tool.skillz.file-size.exceptions]
"packages/agent-session-analytics/src/agent_session_analytics/_adapters/codex.py" = { max_lines = 376, reason = "Pre-existing file at adoption; keep its measured ceiling until it is split." }
