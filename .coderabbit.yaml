# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Shared review rules live in .github/copilot-instructions.md.
# This file holds only the CodeRabbit-specific settings.
language: en-US
tone_instructions: >-
  Be terse and factual. No praise, thanks, emoji, or promotional text.
  State the impact and a concrete failure scenario first.
reviews:
  profile: chill
  poem: false
  in_progress_fortune: false
  path_instructions:
    - path: "lib/src/skillz_experiments/**"
      instructions: >-
        Read the contract model and the reference docs before you claim the
        meaning of a contract field. Check which fixture a test uses before
        you generalize its behavior to other contracts.
  tools:
    # just build runs these linters in CI.
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
knowledge_base:
  code_guidelines:
    # A string entry applies only to files under the guideline's own
    # directory. Map the .github/ guidelines to the files they govern.
    # The root AGENTS.md is a default pattern and applies to all files.
    filePatterns:
      - files: .github/copilot-instructions.md
        applyTo: "**"
      - files: .github/instructions/skills.instructions.md
        applyTo: "skills/**/SKILL.md,.agents/skills/**/SKILL.md"
