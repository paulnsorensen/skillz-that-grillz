# Dependabot configuration — version updates only.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# release.yml pins `yamllint` and `pyyaml` through a hard-coded `pip install`
# step that has no manifest; Dependabot does not track or update those pins.
# The github-actions ecosystem below covers only action refs (`uses: ...@sha`).
# The uv ecosystem below covers lib/fromargs/pyproject.toml. Add another
# ecosystem as soon as a new manifest lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /lib/fromargs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
