# Dependabot configuration — version updates only.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# GitHub Actions refs and the /lib and /lib/fromargs uv projects have
# Dependabot updates. lib/fromargs/uv.lock also pins every skill .pyz closure.
# Workflow pip pins have no manifest. Dependabot does not update them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directories: [/lib, /lib/fromargs]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
