# Dependabot configuration — version updates only.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The github-actions ecosystem covers workflow files and a hard-coded
# `pip install pyyaml==6.0.2` step in validate.yml, which has no manifest.
# The uv ecosystem covers lib/fromargs/pyproject.toml. Add another
# ecosystem as soon as a new manifest lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /lib/fromargs
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
