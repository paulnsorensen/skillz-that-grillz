name: publish fromargs

on:
  push:
    tags: ["fromargs-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check fromargs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Refusing to publish a release from an unreviewed branch."
            exit 1
          fi

      - name: Verify tag version matches pyproject.toml
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#fromargs-v}"
          project_version="$(grep -m1 '^version = ' lib/fromargs/pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} names version ${tag_version}, but lib/fromargs/pyproject.toml has ${project_version}."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"

      - name: Run fromargs tests
        run: uv run --locked --project lib/fromargs pytest lib/fromargs/tests -q

      - name: Build fromargs
        run: uv build --project lib/fromargs --out-dir dist

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fromargs-dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fromargs-dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"

      - name: Publish to PyPI
        run: uv publish dist/*
