name: publish fromargs

on:
  push:
    tags: ["fromargs-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check fromargs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Refusing to publish a release from an unreviewed branch."
            exit 1
          fi

      - name: Verify tag version matches pyproject.toml
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#fromargs-v}"
          project_version="$(grep -m1 '^version = ' packages/fromargs/pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} names version ${tag_version}, but packages/fromargs/pyproject.toml has ${project_version}."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"

      - name: Install just
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@1.59.0
          fallback: none

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir -p notes
          just fromargs-release-notes "${GITHUB_REF_NAME#fromargs-v}" > notes/release-notes.md
          cat notes/release-notes.md

      - name: Run fromargs tests
        run: just test-fromargs

      - name: Build fromargs
        run: uv build --package fromargs --no-sources --out-dir dist

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fromargs-dist
          path: dist/

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fromargs-notes
          path: notes/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fromargs-dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"

      - name: Publish to PyPI
        run: uv publish dist/*

  github-release:
    name: publish github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fromargs-dist
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fromargs-notes
          path: notes

      - name: Create GitHub release
        # Re-running the workflow must not fail on an existing release.
        # `--latest=false` keeps the skills release as the repository's latest release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "error: tag $TAG resolves to $tag_sha, not the workflow commit $GITHUB_SHA." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --latest=false \
            --title "fromargs ${TAG#fromargs-v}" \
            --notes-file notes/release-notes.md
