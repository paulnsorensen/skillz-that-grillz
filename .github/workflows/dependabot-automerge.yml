# Trusted default-branch code removes stale GitHub auto-merge requests.
name: dependabot auto-merge

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-auto-merge-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: remove native auto-merge requests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Disable native auto-merge for open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |-
          set -euo pipefail
          pulls=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" --jq '.[] | select(.user.login == "dependabot[bot]") | .number')
          failed=0
          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            if ! armed=$(gh pr view "$number" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null'); then
              echo >&2 "PR $number: could not read auto-merge state"
              failed=1
              continue
            fi
            if [[ "$armed" != "true" && "$armed" != "false" ]]; then
              echo >&2 "PR $number: invalid auto-merge state"
              failed=1
              continue
            fi
            if [[ "$armed" == "true" ]]; then
              if ! gh pr merge "$number" --repo "$GH_REPO" --disable-auto; then
                echo >&2 "PR $number: could not disable auto-merge"
                failed=1
                continue
              fi
              if ! state=$(gh pr view "$number" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null'); then
                echo >&2 "PR $number: could not verify auto-merge state"
                failed=1
                continue
              fi
              if [[ "$state" != "false" ]]; then
                echo >&2 "PR $number: auto-merge remains armed"
                failed=1
              fi
            fi
          done <<< "$pulls"
          exit "$failed"
