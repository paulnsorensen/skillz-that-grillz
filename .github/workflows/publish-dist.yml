name: publish dist

# Each run publishes the main tip as one dist commit: the main tree plus the
# skill archives built from that commit. One push moves dist, so an install from
# the default branch (`dist`) sees one consistent set of skills and archives.
# Main tracks no archives, so a merge-queue candidate never fails on a stale
# archive (docs/agents/decisions/wedge-skill-packaging.md ADR-012).
#
# A run publishes the main tip, not the commit that started it. A cancelled or
# failed run therefore loses nothing: the next push, manual run, or hourly
# reconcile publishes every commit that the lost run missed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. GitHub keeps one pending run per group and cancels the
# older pending run; the run that remains publishes the newest main tip.
concurrency:
  group: publish-dist
  cancel-in-progress: false

jobs:
  publish:
    name: publish dist branch
    runs-on: ubuntu-latest
    # The push uses DIST_PUSH_TOKEN, not GITHUB_TOKEN. dist holds the full main
    # tree, and GitHub rejects a GITHUB_TOKEN push that adds or changes a file
    # under .github/workflows/. The token needs contents and workflows write.
    permissions:
      contents: read
    steps:
      - name: Require the dist push token
        env:
          DIST_PUSH_TOKEN: ${{ secrets.DIST_PUSH_TOKEN }}
        run: |
          if [ -z "$DIST_PUSH_TOKEN" ]; then
            echo "::error::Set the DIST_PUSH_TOKEN secret: a token with contents and workflows write on this repository."
            exit 1
          fi

      # A schedule or manual run starts on the default branch; always build main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.DIST_PUSH_TOKEN }}
          persist-credentials: true

      - name: Compare dist with main
        id: plan
        run: |
          set -euo pipefail
          main=$(git rev-parse HEAD)
          published=$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' origin/dist 2>/dev/null || true)
          if [ "$published" = "$main" ]; then
            echo "dist already holds main@$main"
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "dist holds main@${published:-none}; publishing main@$main"
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.plan.outputs.publish == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.plan.outputs.publish == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: false

      - name: Build archives
        if: steps.plan.outputs.publish == 'true'
        run: uv run --locked --project packages/wedge wedge bundle skills/skillz

      - name: Run each archive
        if: steps.plan.outputs.publish == 'true'
        run: |
          set -euo pipefail
          for archive in skills/*/scripts/*.pyz; do
            python3 -I "$archive" --help >/dev/null
          done

      - name: Publish dist commit
        if: steps.plan.outputs.publish == 'true'
        run: |-
          python3 .github/scripts/publish_dist.py \
            --source HEAD --staged . \
            --remote origin --branch dist --trunk origin/main
