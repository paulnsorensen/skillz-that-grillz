name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wedge-action:
    # Run the public composite action the way a consumer does, including the
    # consumer example that has its own pyproject.toml and uv.lock.
    name: wedge action (check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check wedge locks
        id: wedge
        uses: ./actions/wedge
        with:
          command: check
          roots: lib/examples/skills lib/examples/consumer/skills

      - name: Verify action output
        env:
          RESULT: ${{ steps.wedge.outputs.result }}
        run: |
          set -euo pipefail
          jq -e '.ok == true and (.checked | index("lib/examples/consumer/skills/hello"))' <<<"$RESULT"
  gate:
    name: gate (just ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        # `just test` runs the lib pytest suite through `uv run`.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"

      - name: Install just
        # The gate uses `[script]` recipes, which require just >= 1.34 — newer
        # than distro apt packages ship. setup-just installs a current release.
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install gate tooling
        # `just ci` is the single source of truth — the same gate runs locally.
        # Pin the tools it shells out to so CI matches a developer's machine:
        #   npm: markdownlint-cli2
        #   pip: yamllint + pyyaml (validators)
        #   uv: pinned by the Install uv step; lib pytest from its uv.lock
        #   release binary: yamlfmt (the gate's yaml-fmt step; no apt/npm/pip package)
        #   release binary: duckdb CLI (the skillz engine test suite)
        run: |
          set -euo pipefail
          npm install -g markdownlint-cli2@0.22.1
          pip install --no-cache-dir \
            yamllint==1.35.1 \
            pyyaml==6.0.2
          curl -fsSL https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin yamlfmt
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip \
            -o /tmp/duckdb_cli.zip
          sudo unzip -o /tmp/duckdb_cli.zip -d /usr/local/bin

      - name: Run gate (just ci)
        env:
          REQUIRE_DUCKDB: "1"
        run: just ci

  fromargs-tests:
    name: fromargs tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Run fromargs tests
        run: just test-fromargs ${{ matrix.python }}

  pr-title:
    name: conventional commits pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
