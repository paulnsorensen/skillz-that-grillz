name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (just ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install just
        # The gate uses `[script]` recipes, which require just >= 1.34 — newer
        # than distro apt packages ship. setup-just installs a current release.
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install gate tooling
        # `just ci` is the single source of truth — the same gate runs locally.
        # Pin the tools it shells out to so CI matches a developer's machine:
        #   apt: shellcheck, bats   npm: markdownlint-cli2
        #   pip: yamllint + pyyaml (validators) + pytest (ralphify) + ast-grep (bash-shorten)
        #   release binary: yamlfmt (the gate's yaml-fmt step; no apt/npm/pip package)
        # `sg` (ast-grep) collides with util-linux on Ubuntu; the pip wheel's bin
        # is earlier on PATH via setup-python, same as the old validate job.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          npm install -g markdownlint-cli2@0.22.1
          pip install --no-cache-dir \
            yamllint==1.35.1 \
            pyyaml==6.0.2 \
            pytest==8.3.4 \
            ast-grep-cli==0.42.1
          curl -fsSL https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin yamlfmt

      - name: Run gate (just ci)
        run: just ci

  install-script:
    name: test install.sh (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Lint install.sh
        run: shellcheck scripts/install.sh

      - name: Lint skillz.sh
        run: shellcheck skills/file-handler/scripts/skillz.sh

      - name: Install bats
        run: brew install bats-core

      - name: Install ast-grep (sg)
        # Hard requirement of bash-shorten.py — installed before the bats
        # tests so the engine path is exercised. install.sh would also
        # bring this down, but its dry-run runs after these tests.
        run: brew install ast-grep

      - name: Run install.sh unit tests
        run: bats tests/bash/test_install.bats

      - name: Run skillz.sh unit tests
        run: bats tests/bash/test_skillz.bats

      - name: Run bash-shorten.py CLI tests
        run: bats tests/bash-shortening/test_bash_shorten.bats

      - name: Run attribution unit tests
        run: bats tests/bash/test_respond_post_reply.bats

      # Dry-run smoke: exercises arg parsing, selection validation, and
      # the skill-install dispatch path. Does NOT actually run brew or
      # gh skill install, so it will not catch regressions in the real
      # install paths (broken tap, renamed formula, etc.). Promote to a
      # real install (drop --dry-run) once the repo is published and CI
      # has authenticated gh available.
      - name: install.sh dry-run smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/install.sh --skip-mcp --dry-run

  pr-title:
    name: conventional commits pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
