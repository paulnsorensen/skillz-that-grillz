# Auto-label PRs from their conventional-commit title prefix so that
# `gh release --generate-notes` groups them into the categories defined
# in .github/release.yml. Without labels every PR falls into the
# release.yml "*" catch-all ("Other changes"), which is why v0.0.2 notes
# came out flat.
#
# Mapping (prefix -> default GitHub label):
#   feat:        -> enhancement
#   fix:         -> bug
#   docs:        -> documentation
#   chore(deps): -> dependencies
#   anything else -> no label (falls into release.yml "Other changes")
#
# Only the four labels above are touched because they exist on every
# GitHub repo by default — no label-creation step required. The script
# also removes any *managed* label that no longer matches the current
# title (e.g. a PR retitled feat: -> fix: loses `enhancement` and gains
# `bug`), so editing the title doesn't leave stale labels behind.
#
# `pull_request_target` (not `pull_request`) so the workflow runs in the
# base-repo context with write permission to labels, which is needed
# when contributions arrive from forks. No PR code is checked out, so
# the usual `pull_request_target` checkout-injection risk does not apply.

name: pr-auto-label

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const MANAGED = ['enhancement', 'bug', 'documentation', 'dependencies'];
            const title = context.payload.pull_request.title || '';
            // Conventional commit: type(scope)?!?:
            const m = title.match(/^([a-z]+)(\(([^)]+)\))?!?:/);
            const type = m ? m[1] : '';
            const scope = m && m[3] ? m[3] : '';
            const map = {
              feat: 'enhancement',
              fix: 'bug',
              docs: 'documentation',
            };
            let desired = map[type] || null;
            if (type === 'chore' && /^deps/.test(scope)) desired = 'dependencies';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = (context.payload.pull_request.labels || []).map(l => l.name);
            const toRemove = MANAGED.filter(l => l !== desired && current.includes(l));
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            if (desired && !current.includes(desired)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: [desired],
              });
            }
