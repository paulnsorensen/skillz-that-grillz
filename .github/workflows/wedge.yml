name: wedge

# No pull_request trigger: `wedge check` inside `just build` already guards
# every PR by failing when a lock is missing, stale, or the launcher drifted.
# This workflow only builds and uploads release assets after a change lands
# on main.
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "actions/wedge/**"
      - "skills/*/wedge.toml"
      - "skills/**/*.wedge.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish wedge assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dogfood the public action from this checkout. Consumers pin
      # paulnsorensen/skillz-that-grillz/actions/wedge@<sha> instead.
      # `branch: main` refuses a commit that main does not contain, so a
      # workflow_dispatch from another ref cannot publish.
      - name: Publish wedge assets
        # Skip when no skill under `roots: skills` is wedged yet, so this
        # workflow stays green on a merge that only touches lib/**.
        if: hashFiles('skills/*/wedge.toml') != ''
        uses: ./actions/wedge
        with:
          command: publish
          roots: skills
          branch: main
