name: wedge

# No pull_request trigger: `wedge check` inside `just build` already guards
# every PR by failing when a lock is missing, stale, or the launcher drifted.
# This workflow only builds and uploads release assets after a change lands
# on main.
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "actions/wedge/**"
      - "skills/**/wedge.toml"
      - "skills/**/*.wedge.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wedge
  cancel-in-progress: false

jobs:
  publish:
    name: publish wedge assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify HEAD is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main. Refusing to publish wedge assets from an unreviewed commit."
            exit 1
          fi

      # Dogfood the public action from this checkout. Consumers pin
      # paulnsorensen/skillz-that-grillz/actions/wedge@<sha> instead.
      - name: Publish wedge assets
        uses: ./actions/wedge
        with:
          command: publish
          roots: skills
          repo: ${{ github.repository }}
          target: ${{ github.sha }}
