name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish github release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Refusing to publish a release from an unreviewed branch."
            exit 1
          fi

      - name: Install pinned gh CLI
        env:
          GH_VERSION: "2.92.0"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Validate skills
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Publish agent skills
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |-
          set -euo pipefail

          # gh skill publish wants to (re)create the trigger tag itself, so we
          # drop it first. If publish fails, restore the tag at its original
          # SHA so consumers and retries aren't broken by a missing release tag.
          git push origin ":refs/tags/$TAG"
          git tag -d "$TAG" || true

          if ! gh skill publish --tag "$TAG"; then
            echo "::error::publish failed; restoring trigger tag $TAG at $SHA"
            git tag "$TAG" "$SHA"
            git push origin "$TAG"
            exit 1
          fi
