name: release

# This workflow has no `version:` keys yet. When plugin manifests land, their
# `version:` fields become the single source of release versions; until then the
# trigger tag (github.ref_name) is authoritative and any future `version:` keys
# are intentionally unused — do not wire them into publish before manifests ship.

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish github release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Refusing to publish a release from an unreviewed branch."
            exit 1
          fi

      - name: Install pinned gh CLI
        env:
          GH_VERSION: "2.92.0"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Check if already published
        # Idempotency guard: re-pushing the trigger tag must be a no-op. A bare
        # `exit 0` here would NOT skip later steps — a successful step just lets
        # the job continue. So record the answer as an output and gate every
        # downstream step on it; that is what prevents duplicate releases.
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already published; skipping gate and publish."
            echo "already_published=true" >>"$GITHUB_OUTPUT"
          else
            echo "already_published=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.already_published != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install just
        if: steps.guard.outputs.already_published != 'true'
        # The gate uses `[script]` recipes, which require just >= 1.34 — newer
        # than distro apt packages ship. setup-just installs a current release.
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install gate tooling
        if: steps.guard.outputs.already_published != 'true'
        # `just ci` is the single source of truth — the same gate runs locally.
        # Pin the tools it shells out to so CI matches a developer's machine:
        #   apt: shellcheck, bats   npm: markdownlint-cli2
        #   pip: yamllint + pyyaml (validators) + pytest (ralphify) + ast-grep (bash-shorten)
        #   release binary: yamlfmt (the gate's yaml-fmt step; no apt/npm/pip package)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          npm install -g markdownlint-cli2@0.22.1
          pip install --no-cache-dir \
            yamllint==1.35.1 \
            pyyaml==6.0.2 \
            pytest==8.3.4 \
            ast-grep-cli==0.42.1
          curl -fsSL https://github.com/google/yamlfmt/releases/download/v0.21.0/yamlfmt_0.21.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin yamlfmt

      - name: Run gate (just ci)
        if: steps.guard.outputs.already_published != 'true'
        # Full quality gate must pass before anything is published. This is the
        # same gate that guards every PR (validate.yml); a release must clear it.
        run: just ci

      - name: Validate skills
        if: steps.guard.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Publish agent skills
        if: steps.guard.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          # `gh skill publish --tag` *creates* the tag, so it errors ("tag
          # already exists") whenever the trigger tag is already present — which
          # it always is here, because the tag push is what started this run.
          # The "Validate skills" step already ran `gh skill publish --dry-run`
          # (spec validation + install-metadata check), so all that remains is
          # release creation — which is exactly what `gh skill publish` does
          # internally. Create the release directly against the existing tag;
          # the already_published guard keeps re-runs idempotent.
          gh release create "$TAG" --title "$TAG" --generate-notes --latest
