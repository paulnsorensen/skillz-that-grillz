name: wedge-publish
description: >-
  Build and publish wedge-packaged skill .pyz assets to the rolling wedge
  GitHub release.

# A composite action cannot set `permissions:` — the calling job must grant
# `contents: write` for the gh CLI release/upload calls this action makes.

inputs:
  roots:
    description: Space-separated skill discovery roots (glob */wedge.toml).
    required: false
    default: skills
  repo:
    description: GitHub repo in owner/name form.
    required: true
  target:
    description: Commit-ish the wedge release points at if it must be created.
    required: false
    default: ${{ github.sha }}
  token:
    description: GitHub token the gh CLI uses to publish.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.32"

    - name: Install pinned gh CLI
      shell: bash
      env:
        GH_VERSION: "2.92.0"
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar -xz -C /tmp
        sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
        gh --version

    - name: Publish wedge assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WEDGE_ROOTS: ${{ inputs.roots }}
        WEDGE_REPO: ${{ inputs.repo }}
        WEDGE_TARGET: ${{ inputs.target }}
      run: |-
        set -euo pipefail
        read -r -a roots <<<"$WEDGE_ROOTS"
        root_args=()
        for root in "${roots[@]}"; do
          root_args+=(--root "$root")
        done
        uv run --locked --project lib wedge publish "${root_args[@]}" --repo "$WEDGE_REPO" --target "$WEDGE_TARGET"
